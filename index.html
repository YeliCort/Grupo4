<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Pixel Buds Pro - Google Store</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <div class="nav-logo">
      <span>G</span><span>o</span><span>o</span>gle Store
    </div>
    <ul class="nav-links">
      <li><a href="#">Phones</a></li>
      <li><a href="#" class="active">Earbuds</a></li>
      <li><a href="#">Watches</a></li>
      <li><a href="#">Smart Home</a></li>
      <li><a href="#">Accessories</a></li>
      <li><a href="#">Subscriptions</a></li>
    </ul>
    <div class="nav-icons">
      <span>🔍</span><span>🌐</span><span>👤</span><span>🛒</span>
    </div>
  </nav>

  <main class="container">
    <a class="back-link" href="#">
      <img class="icon" src="./images/icons/Arrow-Flecha.svg" alt="arrow" />
      See product details
    </a>

    <div class="product-container">
      <section class="product-gallery">
        <div class="thumbnails">
          <img src="./images/earbuds/earbuds_01.png" class="thumb active" data-image="./images/earbuds/earbuds_01.png">
          <img src="./images/earbuds/earbuds_02.png" class="thumb" data-image="./images/earbuds/earbuds_02.png">
          <img src="./images/earbuds/earbuds_03.png" class="thumb" data-image="./images/earbuds/earbuds_03.png">
          <img src="./images/earbuds/earbuds_04.png" class="thumb" data-image="./images/earbuds/earbuds_04.png">
        </div>
        <div class="main-image">
          <img id="mainProductImage" src="./images/earbuds/earbuds_01.png" alt="principal">
        </div>
      </section>

      <section class="product-info">
        <p class="product-category">Music &amp; Sound</p>
        <h1 class="product-title">Google Pixel Buds Pro</h1>
        <p class="product-price-top">229 €</p>
        <hr class="divider" />
        
        <div class="color-selection">
          <p class="color-label">Choose a color</p>
          <div class="color-swatches">
            <div class="swatch sky selected"></div>
            <div class="swatch dark"></div>
            <div class="swatch sage"></div>
            <div class="swatch mint"></div>
            <div class="swatch coral"></div>
          </div>
        </div>

        <div class="purchase-card">
          <p class="price-large">229 €</p>
          <hr class="divider" />
          <div class="cart-row">
            <div class="qty-box">
              <button onclick="changeQty(-1)">−</button>
              <input type="number" id="qty" value="1" min="1" max="99" />
              <button onclick="changeQty(1)">+</button>
            </div>
            <button class="btn-cart">Add to Cart</button>
          </div>
          <p class="delivery-info">
            🚚 Delivery: 29 Apr to <a href="#">39003</a>
          </p>
        </div>
      </section>
    </div>
  </main>

  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-social">
        <img src="images/icons/SM-x.svg" alt="X" />
        <img src="images/icons/SM-instagram.svg" alt="Instagram" />
        <img src="images/icons/SM-facebook.svg" alt="Facebook" />
        <img src="images/icons/SM-youtube.svg" alt="YouTube" />
        <img src="images/icons/SM-tiktok.svg" alt="TikTok" />
      </div>

      <span class="footer-country">
        <img src="https://flagcdn.com/es.svg" alt="Spain flag" width="20" height="14" />
        Spain
      </span>

      <div class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Google Store Conditions</a>
        <a href="#">Terms of Service</a>
      </div>
    </div>
  </footer>

  <script>
    function changeQty(delta) {
      const input = document.getElementById("qty");
      const val = parseInt(input.value) + delta;
      if (val >= 1 && val <= 99) input.value = val;
    }

    document.querySelectorAll(".swatch").forEach((swatch) => {
      swatch.addEventListener("click", () => {
        document.querySelectorAll(".swatch").forEach((s) => s.classList.remove("selected"));
        swatch.classList.add("selected");
      });
    });

    const mainImage = document.getElementById("mainProductImage");
    document.querySelectorAll(".thumb").forEach((thumb) => {
      thumb.addEventListener("click", () => {
        document.querySelectorAll(".thumb").forEach((t) => t.classList.remove("active"));
        thumb.classList.add("active");
        const newImage = thumb.dataset.image;
        if (newImage) {
          mainImage.src = newImage;
        }
      });
    });
  </script>
</body>
</html>
